name: regression-suite

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run reproducible regression suite
        run: python automation/scripts/run_full_validation.py
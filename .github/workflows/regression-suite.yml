name: regression-suite

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run reproducible regression suite
        env:
          AUSF_FORCE_DOCKER_JAVA_TESTS: "1"
        run: python automation/scripts/run_full_validation.py

      - name: Dump container state on failure
        if: failure()
        run: |
          docker ps -a
          for name in ausf-control-plane ausf-go mock-udm mock-nrf mock-amf ausf-postgres; do
            echo "=== logs: $name ==="
            docker logs --tail 100 $name 2>&1 || true
          done
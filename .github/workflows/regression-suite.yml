name: regression-suite

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run reproducible regression suite
        env:
          AUSF_FORCE_DOCKER_JAVA_TESTS: "1"
        run: python automation/scripts/run_full_validation.py

      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: ci-container-logs/
          if-no-files-found: ignore
          retention-days: 7
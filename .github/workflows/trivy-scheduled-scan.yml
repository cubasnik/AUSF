name: trivy-scheduled-scan

on:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  MICROSERVICE_IMAGE: ghcr.io/${{ github.repository_owner }}/ausf-microservice
  CONTROL_PLANE_IMAGE: ghcr.io/${{ github.repository_owner }}/ausf-control-plane

jobs:
  # ─────────────────────────────────────────────────────────────
  # Weekly scan of the latest published images in GHCR.
  # Uploads findings to GitHub Security tab (SARIF).
  # Does NOT fail the build on HIGH — CRITICAL-only is the gate.
  # ─────────────────────────────────────────────────────────────
  scan-latest:
    name: Trivy weekly scan — ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: microservice
            ref: ${{ github.repository_owner }}/ausf-microservice:latest
            category: trivy-scheduled-microservice
          - name: control-plane
            ref: ${{ github.repository_owner }}/ausf-control-plane:latest
            category: trivy-scheduled-control-plane

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan ${{ matrix.image.name }} for CVEs
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: ghcr.io/${{ matrix.image.ref }}
          format: sarif
          output: trivy-${{ matrix.image.name }}.sarif
          # Report CRITICAL and HIGH; exit-code 0 so the job always
          # uploads findings — developer review happens in Security tab.
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif
          category: ${{ matrix.image.category }}

      - name: Fail if CRITICAL CVEs found (unfixed)
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: ghcr.io/${{ matrix.image.ref }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

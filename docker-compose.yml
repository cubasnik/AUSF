services:
  mock-udm:
    image: python:3.12-slim
    container_name: mock-udm
    working_dir: /app
    command: ["python", "mock-network-functions/udm_server.py"]
    environment:
      MOCK_UDM_SUBSCRIBERS_FILE: /app/control-plane/data/subscribers.json
    volumes:
      - ./:/app:ro
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8090/healthz', timeout=5).read()"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2s

  mock-nrf:
    image: python:3.12-slim
    container_name: mock-nrf
    working_dir: /app
    command: ["python", "mock-network-functions/nrf_server.py"]
    environment:
      MOCK_NRF_UDM_BASE_URL: http://mock-udm:8090
    volumes:
      - ./:/app:ro
    depends_on:
      mock-udm:
        condition: service_healthy
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8091/healthz', timeout=5).read()"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2s

  ausf-go:
    build:
      context: ./microservices
      dockerfile: Dockerfile
    container_name: ausf-go
    environment:
      AUSF_HOST: 0.0.0.0
      AUSF_PORT: 8080
      CONTROL_PLANE_BASE_URL: http://ausf-control-plane:8081
    ports:
      - "8080:8080"
    depends_on:
      mock-udm:
        condition: service_healthy
      mock-nrf:
        condition: service_healthy
      ausf-control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  ausf-control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    container_name: ausf-control-plane
    environment:
      SERVER_PORT: 8081
      AUSF_UDM_MODE: http
      AUSF_NNRF_BASE_URL: http://mock-nrf:8091
    ports:
      - "8081:8081"
    depends_on:
      mock-udm:
        condition: service_healthy
      mock-nrf:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

{{- $fullname := include "ausf.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-control-plane
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ausf.labels" . | nindent 4 }}
    {{- include "ausf.controlplane.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.replicaCount }}
  selector:
    matchLabels:
      {{- include "ausf.controlplane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ausf.labels" . | nindent 8 }}
        {{- include "ausf.controlplane.selectorLabels" . | nindent 8 }}
      {{- with .Values.controlPlane.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: control-plane
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag }}"
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.controlPlane.service.port }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.controlPlane.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            # UDM address — resolves to mock service when mocks.enabled
            {{- if .Values.mocks.enabled }}
            - name: AUSF_UDM_BASE_URL
              value: "http://{{ $fullname }}-mock-udm.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.mocks.udm.service.port }}"
            - name: AUSF_NNRF_BASE_URL
              value: "http://{{ $fullname }}-mock-nrf.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.mocks.nrf.service.port }}"
            {{- end }}
            {{- if .Values.controlPlane.existingSecret }}
            envFrom:
              - secretRef:
                  name: {{ .Values.controlPlane.existingSecret }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 2
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Spring Boot writes tmp files
            capabilities:
              drop:
                - ALL
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-control-plane
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ausf.labels" . | nindent 4 }}
    {{- include "ausf.controlplane.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.controlPlane.service.type }}
  ports:
    - port: {{ .Values.controlPlane.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ausf.controlplane.selectorLabels" . | nindent 4 }}

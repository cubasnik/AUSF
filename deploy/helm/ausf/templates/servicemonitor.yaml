{{- if .Values.serviceMonitor.enabled }}
---
# ServiceMonitor — Go microservice (/metrics on port 8080)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ausf.fullname" . }}-microservice
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "ausf.name" . }}-microservice
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: ausf-microservice
      release: {{ .Release.Name }}
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
---
# ServiceMonitor — Java control-plane (/actuator/prometheus on port 8081)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ausf.fullname" . }}-control-plane
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "ausf.name" . }}-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: ausf-control-plane
      release: {{ .Release.Name }}
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}

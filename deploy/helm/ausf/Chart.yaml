apiVersion: v2
name: ausf
description: >
  5G AUSF (Authentication Server Function) — polyglot reference implementation.
  Deploys the Go microservice front-end, Java Spring Boot control-plane, and
  optional mock network functions (AMF, NRF, UDM).
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - 5g
  - ausf
  - 3gpp
  - sbi
maintainers:
  - name: AUSF team

dependencies:
  # Bitnami PostgreSQL — enabled by default; set postgresql.enabled=false
  # and configure externalDatabase to use a bring-your-own database.
  - name: postgresql
    version: "^16.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled

  # Bitnami Redis — disabled by default; enable together with
  # namfQueue.backend=redis to activate the persistent Namf retry queue.
  - name: redis
    version: "^20.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled

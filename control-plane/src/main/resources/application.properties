spring.application.name=ausf-control-plane
server.port=${SERVER_PORT:8081}
ausf.udm.mode=${AUSF_UDM_MODE:mock}
ausf.udm.base-url=${AUSF_UDM_BASE_URL:}
ausf.udm.breaker.failure-threshold=${AUSF_UDM_BREAKER_FAILURES:5}
ausf.udm.breaker.open-duration-seconds=${AUSF_UDM_BREAKER_OPEN_SECONDS:10}
ausf.nnrf.base-url=${AUSF_NNRF_BASE_URL:}
ausf.nnrf.nf-instance-id=${AUSF_NNRF_NF_INSTANCE_ID:}
ausf.nnrf.heartbeat-interval-seconds=${AUSF_NNRF_HEARTBEAT_INTERVAL:30}
ausf.tls.client.ca-cert-file=${AUSF_TLS_CLIENT_CA_CERT_FILE:}
server.ssl.enabled=${AUSF_SERVER_TLS_ENABLED:false}
server.ssl.key-store=${AUSF_SERVER_TLS_KEY_STORE:}
server.ssl.key-store-password=${AUSF_SERVER_TLS_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${AUSF_SERVER_TLS_KEY_STORE_TYPE:PKCS12}

# Subscriber database config
spring.datasource.url=${AUSF_SUBSCRIBER_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/ausf}
spring.datasource.driverClassName=${AUSF_SUBSCRIBER_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${AUSF_SUBSCRIBER_DATASOURCE_USERNAME:ausf}
spring.datasource.password=${AUSF_SUBSCRIBER_DATASOURCE_PASSWORD:ausf}
spring.jpa.hibernate.ddl-auto=update
ausf.subscriber.seed.enabled=${AUSF_SUBSCRIBER_SEED_ENABLED:true}
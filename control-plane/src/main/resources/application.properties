spring.application.name=ausf-control-plane
server.port=${SERVER_PORT:8081}
# HTTP/2 support (h2c for non-TLS, h2 for TLS) — required for 5G SBI per TS 29.500
server.http2.enabled=true
ausf.udm.mode=${AUSF_UDM_MODE:mock}
ausf.udm.base-url=${AUSF_UDM_BASE_URL:}
ausf.udm.breaker.failure-threshold=${AUSF_UDM_BREAKER_FAILURES:5}
ausf.udm.breaker.open-duration-seconds=${AUSF_UDM_BREAKER_OPEN_SECONDS:10}
ausf.nnrf.base-url=${AUSF_NNRF_BASE_URL:}
ausf.nnrf.nf-instance-id=${AUSF_NNRF_NF_INSTANCE_ID:}
ausf.nnrf.heartbeat-interval-seconds=${AUSF_NNRF_HEARTBEAT_INTERVAL:30}
ausf.nnrf.notification-uri=${AUSF_NNRF_NOTIFICATION_URI:}
ausf.tls.client.ca-cert-file=${AUSF_TLS_CLIENT_CA_CERT_FILE:}
server.ssl.enabled=${AUSF_SERVER_TLS_ENABLED:false}
server.ssl.key-store=${AUSF_SERVER_TLS_KEY_STORE:}
server.ssl.key-store-password=${AUSF_SERVER_TLS_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${AUSF_SERVER_TLS_KEY_STORE_TYPE:PKCS12}

# Subscriber database config
spring.datasource.url=${AUSF_SUBSCRIBER_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/ausf}
spring.datasource.driverClassName=${AUSF_SUBSCRIBER_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${AUSF_SUBSCRIBER_DATASOURCE_USERNAME:ausf}
spring.datasource.password=${AUSF_SUBSCRIBER_DATASOURCE_PASSWORD:ausf}
spring.jpa.hibernate.ddl-auto=validate
# Flyway: versioned schema migrations applied from db/migration/V*.sql
spring.flyway.enabled=true
# baseline-on-migrate lets Flyway adopt a pre-existing DB that was
# previously managed by hibernate ddl-auto=update without a baseline table.
spring.flyway.baseline-on-migrate=${AUSF_FLYWAY_BASELINE_ON_MIGRATE:true}
ausf.subscriber.seed.enabled=${AUSF_SUBSCRIBER_SEED_ENABLED:true}

# SIDF: home network private keys for SUCI de-concealment (TS 33.501 Annex C.3)
# Profile A (X25519): raw 32-byte key as lowercase hex string
ausf.sidf.profile-a-private-key=${AUSF_SIDF_PROFILE_A_PRIVATE_KEY:}
# Profile B (P-256): raw 32-byte scalar as lowercase hex string
ausf.sidf.profile-b-private-key=${AUSF_SIDF_PROFILE_B_PRIVATE_KEY:}

# FSM attempt limits (TS 33.501 §6.1.3)
# Maximum number of SYNC_FAILURE (AUTS) cycles per auth context; 0 = unlimited
ausf.auth.maxSyncFailures=${AUSF_AUTH_MAX_SYNC_FAILURES:0}
# Maximum number of EAP-AKA' ongoing round-trips (re-auth + sync-failure) per context; 0 = unlimited
ausf.auth.maxEapOngoing=${AUSF_AUTH_MAX_EAP_ONGOING:0}

# Distributed tracing — OpenTelemetry (W3C traceparent propagation + OTLP/HTTP export)
# Sample 100% of requests by default; reduce in high-traffic production
management.tracing.sampling.probability=${AUSF_OTEL_SAMPLING:1.0}
# OTLP/HTTP endpoint for span export (e.g. http://otel-collector:4318/v1/traces or Jaeger OTLP)
management.otlp.tracing.endpoint=${AUSF_OTEL_ENDPOINT:http://localhost:4318/v1/traces}
# Propagate W3C traceparent so spans from Go microservice are linked as parents
management.tracing.propagation.type=w3c
# Expose only health endpoint; traces are pushed, not pulled
management.endpoints.web.exposure.include=health
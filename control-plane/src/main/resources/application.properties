spring.application.name=ausf-control-plane
server.port=${SERVER_PORT:8081}
ausf.udm.mode=${AUSF_UDM_MODE:mock}
ausf.udm.base-url=${AUSF_UDM_BASE_URL:}
ausf.udm.breaker.failure-threshold=${AUSF_UDM_BREAKER_FAILURES:5}
ausf.udm.breaker.open-duration-seconds=${AUSF_UDM_BREAKER_OPEN_SECONDS:10}
ausf.nnrf.base-url=${AUSF_NNRF_BASE_URL:}
ausf.nnrf.nf-instance-id=${AUSF_NNRF_NF_INSTANCE_ID:}
ausf.nnrf.heartbeat-interval-seconds=${AUSF_NNRF_HEARTBEAT_INTERVAL:30}